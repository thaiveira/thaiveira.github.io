name: Atualizar métricas

on:
  schedule:
    - cron: '0 12 30 1,3-12 *'   
    - cron: '0 12 28 2 *'        
  workflow_dispatch:             

permissions:
  contents: write
  pull-requests: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/metricas/requirements.txt

      - run: pip install -r scripts/metricas/requirements.txt

      - run: python scripts/metricas/gerar_metricas.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Abrir pull request com as métricas
        uses: peter-evans/create-pull-request@v7
        with:
          branch: metricas/atualizacao-automatica
          delete-branch: true
          commit-message: "Atualiza métricas"
          title: "Atualiza métricas"
          body: |
            Métricas geradas automaticamente por `scripts/metricas/gerar_metricas.py`.
            Confira os arquivos alterados antes de aceitar.