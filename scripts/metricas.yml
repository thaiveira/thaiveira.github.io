name: Atualizar métricas do site

on:
  schedule:
    # Roda às 09:00 (horário de Brasília, UTC-3) do dia 1 de cada mês.
    - cron: "0 12 1 * *"
  workflow_dispatch: {} 

permissions:
  contents: write  

jobs:
  atualizar-metricas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r scripts/metricas/requirements.txt

      - name: Rodar o script de métricas
        run: python3 scripts/metricas/gerar_metricas.py
        env:
        
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commitar os gráficos atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imagens/commits.svg imagens/linguagens.svg imagens/estudos.svg scripts/metricas/metrics_summary.json
          git diff --staged --quiet || git commit -m "Atualiza métricas do site (automático, mensal)"
          git push
